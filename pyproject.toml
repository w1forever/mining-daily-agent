[project]
name = "mining-daily-agent"
version = "0.1.0"
description = "矿权日报 Agent：3 个独立 MCP Server + LangGraph Agent Client + FastAPI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.10.0",
    "langchain-mcp-adapters>=0.1.9",
    "langgraph>=0.2.60",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "trafilatura>=1.8.0",
    "PyMuPDF>=1.24.0",
    "pdfplumber>=0.11.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.4.0",
    "structlog>=24.1.0",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-requests>=2.32.0",
]

[project.scripts]
mda-news-server = "mda.servers.mining_news.server:main"
mda-pdf-server = "mda.servers.mineral_pdf.server:main"
mda-price-server = "mda.servers.lme_price.server:main"
mda-api = "mda.api.main:main"
mda-agent-cli = "mda.agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mda*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["mda", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101", "S311"]  # pytest asserts; deterministic random ok in tests
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "B008", "S104", "E402", "B017"]
"scripts/**" = ["E402", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: 真实外部数据源集成测试（需 RUN_LIVE_TESTS=1）",
    "blocked: 因外部依赖（授权/网络）阻塞，默认跳过",
]
addopts = "-q --tb=short -p no:cacheprovider --basetemp=.pytest_tmp"

[tool.mypy]
python_version = "3.10"
strict = false
check_untyped_defs = true
warn_unused_ignores = false
ignore_missing_imports = true
exclude = ["tests/"]
